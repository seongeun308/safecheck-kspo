<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c3f56">
<title>SafeCheck — 체육시설 안전점검 보조</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #f3f6f8;
    --surface: #ffffff;
    --border: #dbe3ea;
    --text: #1c2733;
    --text-muted: #5c6b7a;
    --text-faint: #8a97a3;
    --primary: #1c3f56;
    --primary-dark: #12293a;
    --primary-contrast: #ffffff;
    --accent-bar: #2f7d95;
    --info-bg: #eaf2f6;
    --info-border: #b9d4e0;
    --error-bg: #fdecea;
    --error-border: #f3b7b0;
    --error-text: #8a3227;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
                 "Malgun Gothic", sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    padding-bottom: 32px;
  }

  header.app-header {
    background: var(--primary);
    color: var(--primary-contrast);
    padding: 20px 16px 16px;
  }

  header.app-header h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 700;
  }

  header.app-header p {
    margin: 4px 0 0;
    font-size: 0.85rem;
    color: #c9d8e2;
  }

  .steps-indicator {
    display: flex;
    gap: 6px;
    padding: 12px 16px 0;
    font-size: 0.78rem;
    color: var(--text-faint);
  }

  .steps-indicator span.current {
    color: var(--primary);
    font-weight: 700;
  }

  main {
    padding: 16px;
  }

  .step { display: none; }
  .step.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }

  h2.section-title {
    font-size: 1.05rem;
    margin: 0 0 14px;
    font-weight: 700;
  }

  label.field-label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    padding: 13px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    margin-bottom: 16px;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path d='M4 6l4 4 4-4' stroke='%235c6b7a' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
  }

  select:disabled { color: var(--text-faint); }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 15px 18px;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: var(--radius);
    border: none;
    text-align: center;
  }

  .btn-primary {
    background: var(--primary);
    color: var(--primary-contrast);
  }

  .btn-primary:disabled {
    background: #a9b8c3;
    cursor: not-allowed;
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--primary);
    border: 1px solid var(--primary);
  }

  .btn-text {
    background: transparent;
    color: var(--text-muted);
    font-weight: 600;
    padding: 12px;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  .photo-input-area {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px 16px;
    text-align: center;
    margin-bottom: 14px;
  }

  .photo-input-area p {
    margin: 0 0 14px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  input[type="file"] { display: none; }

  .preview-wrap { margin-bottom: 14px; }

  .preview-wrap img {
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: #000;
  }

  .field-error {
    color: var(--error-text);
    font-size: 0.85rem;
    margin: -8px 0 14px;
  }

  .error-banner {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-text);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
  }

  .error-banner button {
    background: none;
    border: none;
    color: var(--error-text);
    font-weight: 700;
    font-size: 1.1rem;
    line-height: 1;
    padding: 0;
  }

  /* 판정 중 */
  .loading-wrap {
    text-align: center;
    padding: 48px 16px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-message {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    min-height: 1.5em;
  }

  .loading-note {
    margin-top: 10px;
    font-size: 0.82rem;
    color: var(--text-faint);
  }

  /* 결과 화면 */
  .guidance-banner {
    background: var(--info-bg);
    border: 1px solid var(--info-border);
    border-radius: var(--radius);
    padding: 16px;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .judgement-item {
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }

  .judgement-item:last-child { border-bottom: none; }

  .judgement-item.reference {
    opacity: 0.55;
  }

  .reference-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    margin-bottom: 6px;
  }

  .judgement-short {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 2px;
  }

  .judgement-official {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin: 0 0 10px;
  }

  .confidence-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .confidence-track {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .confidence-fill {
    height: 100%;
    background: var(--accent-bar);
    border-radius: 4px;
  }

  .confidence-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .judgement-evidence {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin: 0;
  }

  .notice-box {
    background: var(--surface);
    border: 1px solid var(--primary);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .notice-box .notice-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .notice-box .notice-text {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 12px;
    word-break: keep-all;
  }

  .copy-btn {
    background: var(--primary);
    color: var(--primary-contrast);
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .copy-btn.copied { background: #2f7d55; }

  .extra-note {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: -8px 0 16px;
  }

  /* 공단 점검 사례 */
  .case-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .case-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .case-item img {
    width: 88px;
    height: 66px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .case-notice {
    font-size: 0.9rem;
    margin: 0 0 4px;
    word-break: keep-all;
  }

  .case-date {
    font-size: 0.78rem;
    color: var(--text-faint);
    margin: 0;
  }

  /* 하단 상시 고지 */
  .disclaimer {
    background: #eef1f4;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* 이미지 원본 뷰어 */
  .image-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }

  .image-modal.open { display: flex; }

  .image-modal img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
  }

  @media (min-width: 600px) {
    #app { max-width: 560px; margin: 24px auto; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  }
</style>
</head>
<body>

<div id="app">
  <header class="app-header">
    <h1>SafeCheck</h1>
    <p>체육시설 자율안전점검 보조</p>
  </header>

  <div class="steps-indicator" id="stepsIndicator"></div>

  <main>
    <div id="globalError"></div>

    <!-- 1단계: 위치 선택 -->
    <section class="step" id="step-location">
      <div class="card">
        <h2 class="section-title">어디를 점검하시나요</h2>

        <label class="field-label" for="buildingType">건물구분</label>
        <select id="buildingType">
          <option value="" disabled selected>선택하세요</option>
        </select>

        <label class="field-label" for="positionType">위치구분</label>
        <select id="positionType">
          <option value="" disabled selected>선택하세요</option>
        </select>

        <button class="btn btn-primary" id="toPhotoBtn" disabled>다음</button>
      </div>
    </section>

    <!-- 2단계: 사진 -->
    <section class="step" id="step-photo">
      <div class="card">
        <h2 class="section-title">결함 사진을 올려주세요</h2>

        <div id="previewArea"></div>

        <div class="photo-input-area">
          <p>사진을 촬영하거나 선택하세요<br>JPG·PNG, 10MB 이하</p>
          <label class="btn btn-secondary" for="photoInput" style="display:inline-block;width:auto;padding-left:24px;padding-right:24px;">
            사진 선택
          </label>
          <input type="file" id="photoInput" accept="image/*" capture="environment">
        </div>

        <div class="field-error" id="photoError" style="display:none;"></div>

        <button class="btn btn-primary" id="submitBtn" disabled>판정 시작하기</button>
        <div class="btn-row">
          <button class="btn btn-text" id="backToLocationBtn">← 위치 다시 선택</button>
        </div>
      </div>
    </section>

    <!-- 3단계: 판정 중 -->
    <section class="step" id="step-loading">
      <div class="card loading-wrap">
        <div class="spinner"></div>
        <div class="loading-message" id="loadingMessage" aria-live="polite">사진 확인 중…</div>
        <div class="loading-note">보통 5~10초 정도 걸립니다. 창을 닫지 마세요.</div>
      </div>
    </section>

    <!-- 4단계: 결과 -->
    <section class="step" id="step-result">
      <div id="resultContent"></div>
    </section>
  </main>
</div>

<div class="image-modal" id="imageModal">
  <img id="imageModalImg" src="" alt="공단 점검 사례 원본">
</div>

<script>
(function () {
  "use strict";

  var MAX_UPLOAD_BYTES = 10 * 1024 * 1024;
  var LOADING_MESSAGES = [
    "사진 확인 중…",
    "점검항목과 대조 중…",
    "소견 작성 중…",
    "공단 사례 찾는 중…"
  ];
  var DISCLAIMER_TEXT =
    "본 판정은 자율안전점검 수행을 보조하기 위한 참고 자료이며, 체육시설법에 따른 " +
    "정식 안전점검이나 정밀안전진단을 대체하지 않습니다. 구조적 위험이 의심되는 경우 " +
    "전문 점검기관의 진단을 받으십시오.";

  var state = {
    buildingType: "",
    positionType: "",
    file: null,
    previewUrl: null,
    submitting: false
  };

  var el = {
    steps: document.getElementById("stepsIndicator"),
    globalError: document.getElementById("globalError"),
    buildingType: document.getElementById("buildingType"),
    positionType: document.getElementById("positionType"),
    toPhotoBtn: document.getElementById("toPhotoBtn"),
    previewArea: document.getElementById("previewArea"),
    photoInput: document.getElementById("photoInput"),
    photoError: document.getElementById("photoError"),
    submitBtn: document.getElementById("submitBtn"),
    backToLocationBtn: document.getElementById("backToLocationBtn"),
    loadingMessage: document.getElementById("loadingMessage"),
    resultContent: document.getElementById("resultContent"),
    imageModal: document.getElementById("imageModal"),
    imageModalImg: document.getElementById("imageModalImg")
  };

  var STEP_LABELS = [
    ["step-location", "1 위치선택"],
    ["step-photo", "2 사진"],
    ["step-loading", "3 판정중"],
    ["step-result", "4 결과"]
  ];

  function showStep(id) {
    STEP_LABELS.forEach(function (pair) {
      document.getElementById(pair[0]).classList.toggle("active", pair[0] === id);
    });
    el.steps.innerHTML = STEP_LABELS.map(function (pair) {
      var cls = pair[0] === id ? "current" : "";
      return '<span class="' + cls + '">' + pair[1] + "</span>";
    }).join(" · ");
    window.scrollTo(0, 0);
  }

  function showGlobalError(message) {
    el.globalError.innerHTML =
      '<div class="error-banner"><span>' + escapeHtml(message) +
      '</span><button type="button" aria-label="닫기">&times;</button></div>';
    el.globalError.querySelector("button").addEventListener("click", function () {
      el.globalError.innerHTML = "";
    });
  }

  function clearGlobalError() {
    el.globalError.innerHTML = "";
  }

  function escapeHtml(str) {
    var d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  // ------------------------------------------------------------------
  // 1단계: 위치 선택
  // ------------------------------------------------------------------

  function loadLocations() {
    fetch("/api/locations")
      .then(function (res) {
        if (!res.ok) { throw new Error("불러오기 실패"); }
        return res.json();
      })
      .then(function (data) {
        fillOptions(el.buildingType, data.buildingTypes || []);
        fillOptions(el.positionType, data.positionTypes || []);
      })
      .catch(function () {
        showGlobalError("건물구분·위치구분 목록을 불러오지 못했습니다.");
        var retry = document.createElement("button");
        retry.className = "btn btn-secondary";
        retry.style.marginBottom = "16px";
        retry.textContent = "다시 시도";
        retry.addEventListener("click", function () {
          clearGlobalError();
          loadLocations();
        });
        el.globalError.appendChild(retry);
      });
  }

  // 위치구분 문자열은 공백·괄호까지 서버 원문 그대로 옵션 값으로 써야 한다.
  function fillOptions(select, values) {
    values.forEach(function (v) {
      var opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
  }

  function checkLocationReady() {
    el.toPhotoBtn.disabled = !(el.buildingType.value && el.positionType.value);
  }

  el.buildingType.addEventListener("change", function () {
    state.buildingType = el.buildingType.value;
    checkLocationReady();
  });
  el.positionType.addEventListener("change", function () {
    state.positionType = el.positionType.value;
    checkLocationReady();
  });

  el.toPhotoBtn.addEventListener("click", function () {
    showStep("step-photo");
  });

  el.backToLocationBtn.addEventListener("click", function () {
    showStep("step-location");
  });

  // ------------------------------------------------------------------
  // 2단계: 사진 선택
  // ------------------------------------------------------------------

  function resetPhoto() {
    state.file = null;
    if (state.previewUrl) {
      URL.revokeObjectURL(state.previewUrl);
      state.previewUrl = null;
    }
    el.previewArea.innerHTML = "";
    el.photoInput.value = "";
    el.photoError.style.display = "none";
    el.submitBtn.disabled = true;
  }

  function validatePhoto(file) {
    if (file.size > MAX_UPLOAD_BYTES) {
      return "이미지가 너무 큽니다. 최대 10MB까지 올릴 수 있습니다.";
    }
    var type = (file.type || "").toLowerCase();
    var name = (file.name || "").toLowerCase();
    var looksHeic = type.indexOf("heic") !== -1 || type.indexOf("heif") !== -1 ||
                     /\.(heic|heif)$/.test(name);
    if (looksHeic) {
      return "HEIC 형식은 지원하지 않습니다. JPG 또는 PNG로 저장 후 다시 올려주세요.";
    }
    if (type && type !== "image/jpeg" && type !== "image/png") {
      return "JPG 또는 PNG 형식만 올릴 수 있습니다.";
    }
    return null;
  }

  el.photoInput.addEventListener("change", function () {
    var file = el.photoInput.files && el.photoInput.files[0];
    if (!file) { return; }

    var error = validatePhoto(file);
    if (error) {
      el.photoError.textContent = error;
      el.photoError.style.display = "block";
      el.submitBtn.disabled = true;
      el.previewArea.innerHTML = "";
      state.file = null;
      return;
    }

    el.photoError.style.display = "none";
    state.file = file;
    if (state.previewUrl) { URL.revokeObjectURL(state.previewUrl); }
    state.previewUrl = URL.createObjectURL(file);
    el.previewArea.innerHTML =
      '<div class="preview-wrap"><img src="' + state.previewUrl + '" alt="선택한 사진 미리보기"></div>';
    el.submitBtn.disabled = false;
  });

  el.submitBtn.addEventListener("click", submitJudgement);

  // ------------------------------------------------------------------
  // 3단계: 판정 요청
  // ------------------------------------------------------------------

  var loadingTimer = null;

  function startLoadingMessages() {
    var idx = 0;
    el.loadingMessage.textContent = LOADING_MESSAGES[0];
    loadingTimer = setInterval(function () {
      idx = Math.min(idx + 1, LOADING_MESSAGES.length - 1);
      el.loadingMessage.textContent = LOADING_MESSAGES[idx];
    }, 3000);
  }

  function stopLoadingMessages() {
    if (loadingTimer) {
      clearInterval(loadingTimer);
      loadingTimer = null;
    }
  }

  function submitJudgement() {
    if (state.submitting || !state.file) { return; }
    state.submitting = true;
    el.submitBtn.disabled = true;
    clearGlobalError();

    var form = new FormData();
    form.append("image", state.file);
    form.append("buildingType", state.buildingType);
    form.append("positionType", state.positionType);

    showStep("step-loading");
    startLoadingMessages();

    fetch("/api/judgements", { method: "POST", body: form })
      .then(function (res) {
        return res.json().then(function (body) {
          return { ok: res.ok, body: body };
        }).catch(function () {
          return { ok: res.ok, body: null };
        });
      })
      .then(function (result) {
        stopLoadingMessages();
        state.submitting = false;
        el.submitBtn.disabled = false;

        if (!result.ok) {
          var message = (result.body && result.body.message) ||
            "판정에 실패했습니다. 잠시 후 다시 시도해주세요.";
          showStep("step-photo");
          showGlobalError(message);
          return;
        }
        renderResult(result.body);
        showStep("step-result");
      })
      .catch(function () {
        stopLoadingMessages();
        state.submitting = false;
        el.submitBtn.disabled = false;
        showStep("step-photo");
        showGlobalError("네트워크 오류로 판정에 실패했습니다. 잠시 후 다시 시도해주세요.");
      });
  }

  // ------------------------------------------------------------------
  // 4단계: 결과 렌더링
  // ------------------------------------------------------------------

  function renderResult(result) {
    if (result.status === "DEFECT_FOUND") {
      el.resultContent.innerHTML = renderDefectFound(result);
    } else if (result.status === "NEEDS_BETTER_SHOT") {
      el.resultContent.innerHTML = renderNeedsBetterShot(result);
    } else {
      el.resultContent.innerHTML = renderNoDefect(result);
    }
    bindResultActions(result);
  }

  function renderDefectFound(result) {
    var items = (result.judgements || []).slice(0, 3).map(renderJudgementItem).join("");
    var guidance = result.guidance
      ? '<p class="extra-note">' + escapeHtml(result.guidance) + "</p>" : "";
    return (
      '<div class="card">' +
        '<h2 class="section-title">판정 결과</h2>' +
        '<div>' + items + '</div>' +
      '</div>' +
      '<div class="notice-box">' +
        '<div class="notice-label">점검 소견 초안</div>' +
        '<div class="notice-text" id="noticeText">' + escapeHtml(result.notice || "") + '</div>' +
        '<button type="button" class="copy-btn" id="copyNoticeBtn">소견 복사하기</button>' +
      '</div>' +
      guidance +
      renderCases(result.cases) +
      renderDisclaimer() +
      '<button class="btn btn-primary" id="newCheckBtn" style="margin-top:4px;">새 점검 시작</button>'
    );
  }

  function renderNeedsBetterShot(result) {
    var items = (result.judgements || []).slice(0, 3).map(function (j) {
      return renderJudgementItem(j, true);
    }).join("");
    return (
      '<div class="guidance-banner">' + escapeHtml(result.guidance || "") + '</div>' +
      '<div class="card">' +
        '<h2 class="section-title">참고 판정</h2>' +
        '<div>' + items + '</div>' +
      '</div>' +
      renderCases(result.cases) +
      renderDisclaimer() +
      '<button class="btn btn-primary" id="retakeBtn" style="margin-top:4px;">다시 촬영하기</button>' +
      '<button class="btn btn-text" id="newCheckBtn2" style="width:100%;">새 점검부터 시작</button>'
    );
  }

  function renderNoDefect(result) {
    return (
      '<div class="guidance-banner">' + escapeHtml(result.guidance || "") + '</div>' +
      renderDisclaimer() +
      '<button class="btn btn-primary" id="newCheckBtn" style="margin-top:4px;">새 점검 시작</button>'
    );
  }

  function renderJudgementItem(j, faded) {
    var pct = Math.round((j.confidence || 0) * 100);
    return (
      '<div class="judgement-item' + (faded ? " reference" : "") + '">' +
        (faded ? '<div class="reference-tag">참고</div>' : "") +
        '<p class="judgement-short">' + escapeHtml(j.shortName) + '</p>' +
        '<p class="judgement-official">' + escapeHtml(j.officialName) + '</p>' +
        '<div class="confidence-row">' +
          '<div class="confidence-track"><div class="confidence-fill" style="width:' + pct + '%;"></div></div>' +
          '<span class="confidence-label">확신도 ' + pct + '%</span>' +
        '</div>' +
        '<p class="judgement-evidence">' + escapeHtml(j.evidence || "") + '</p>' +
      '</div>'
    );
  }

  function renderCases(cases) {
    if (!cases || cases.length === 0) { return ""; }
    var items = cases.map(function (c, i) {
      return (
        '<div class="case-item">' +
          '<img src="' + escapeHtml(c.imageUrl) + '" alt="공단 점검 사례 사진" ' +
               'class="case-thumb" data-full="' + escapeHtml(c.imageUrl) + '">' +
          '<div>' +
            '<p class="case-notice">' + escapeHtml(c.notice) + '</p>' +
            '<p class="case-date">점검일 ' + formatDate(c.inspectedOn) + '</p>' +
          '</div>' +
        '</div>'
      );
    }).join("");
    return (
      '<div class="card">' +
        '<h2 class="section-title">공단 점검 사례</h2>' +
        '<div class="case-list">' + items + '</div>' +
      '</div>'
    );
  }

  function formatDate(iso) {
    if (!iso) { return ""; }
    return iso.replace(/-/g, ".");
  }

  function renderDisclaimer() {
    return '<div class="disclaimer">' + escapeHtml(DISCLAIMER_TEXT) + '</div>';
  }

  function bindResultActions(result) {
    var newCheckBtn = document.getElementById("newCheckBtn") || document.getElementById("newCheckBtn2");
    if (newCheckBtn) {
      newCheckBtn.addEventListener("click", resetToLocation);
    }
    var newCheckBtn2 = document.getElementById("newCheckBtn2");
    if (newCheckBtn2 && newCheckBtn2 !== newCheckBtn) {
      newCheckBtn2.addEventListener("click", resetToLocation);
    }

    var retakeBtn = document.getElementById("retakeBtn");
    if (retakeBtn) {
      retakeBtn.addEventListener("click", function () {
        resetPhoto();
        showStep("step-photo");
      });
    }

    var copyBtn = document.getElementById("copyNoticeBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        copyToClipboard(result.notice || "", copyBtn);
      });
    }

    var thumbs = el.resultContent.querySelectorAll(".case-thumb");
    thumbs.forEach(function (img) {
      img.addEventListener("click", function () {
        openImageModal(img.getAttribute("data-full"));
      });
    });
  }

  function copyToClipboard(text, btn) {
    var done = function () {
      var original = btn.textContent;
      btn.textContent = "복사됨";
      btn.classList.add("copied");
      setTimeout(function () {
        btn.textContent = original;
        btn.classList.remove("copied");
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        fallbackCopy(text, done);
      });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) { /* noop */ }
    document.body.removeChild(ta);
    done();
  }

  function resetToLocation() {
    state.buildingType = "";
    state.positionType = "";
    el.buildingType.value = "";
    el.positionType.value = "";
    checkLocationReady();
    resetPhoto();
    showStep("step-location");
  }

  // ------------------------------------------------------------------
  // 사례 원본 뷰어
  // ------------------------------------------------------------------

  function openImageModal(src) {
    el.imageModalImg.src = src;
    el.imageModal.classList.add("open");
  }

  function closeImageModal() {
    el.imageModal.classList.remove("open");
    el.imageModalImg.src = "";
  }

  el.imageModal.addEventListener("click", closeImageModal);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeImageModal(); }
  });

  // ------------------------------------------------------------------

  loadLocations();
  showStep("step-location");
})();
</script>
</body>
</html>
