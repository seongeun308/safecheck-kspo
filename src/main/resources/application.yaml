server:
  port: ${PORT:8080}

spring:
  application:
    name: safecheck-kspo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  config:
    import: optional:file:.env[.properties]

safecheck:
  llm:
    api-key: ${LLM_API_KEY}
    base-url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-5
    max-tokens: 2000
    timeout: 60s
    max-retries: 1

  image:
    max-dimension: 1024
    max-upload-mb: 10

  judgement:
    confidence-threshold: 0.4
    max-judgements: 3
    case-display-limit: 3

  cache:
    max-entries: 1000
    ttl: 24h

  rate-limit:
    per-client-hourly: 20
    daily-total: 300

logging:
  level:
    io.github.seongeun308.safecheck: INFO